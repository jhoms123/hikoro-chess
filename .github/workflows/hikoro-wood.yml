name: Hikoro wooden artwork checks
on:
  push:
    branches: [feat/wooden-hikoro-pieces-board]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HikoroChess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: HikoroChess/package-lock.json
      - run: npm ci
      - run: npm test
